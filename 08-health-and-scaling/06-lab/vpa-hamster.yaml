apiVersion: apps/v1
kind: Deployment
metadata:
  name: hamster
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hamster
  template:
    metadata:
      labels:
        app: hamster
    spec:
      containers:
        - name: hamster
          image: busybox:1.36
          command:
            - sh
            - -c
            - "while true; do i=0; while [ $i -lt 300000 ]; do i=$((i+1)); done; sleep 0.5; done"
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 500m
              memory: 128Mi
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: hamster-vpa
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hamster
  updatePolicy:
    updateMode: "Off"               # quoted: a bare Off is read as the boolean false
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed:
          cpu: 25m
          memory: 16Mi
        maxAllowed:
          cpu: "1"
          memory: 500Mi
        controlledResources: ["cpu", "memory"]