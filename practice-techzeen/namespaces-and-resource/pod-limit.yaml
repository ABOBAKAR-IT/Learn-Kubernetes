apiVersion: v1
kind: Pod
metadata:
  name: limited-pod
  namespace: dev-ns
spec:
  containers:
    - name: busybox-container
      image: busybox-container
      command: ["sh","-c","sleep 3600"]
      resources:
        requests:
          memory: "128Mi" #Mebibyte
          cpu: "100m" # CPU 10%
        limits:
          memory: "256Mi" #Meb
          cpu: "200m"  #CPU 20%